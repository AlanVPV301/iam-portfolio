<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ID Token Claims — OIDC Demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="card wide">
    <span class="tag">ID token</span>
    <h1>ID Token Claims</h1>
    <p class="subtitle">Decoded JWT payload from the token response (signature not verified in this lab stage).</p>

    <table class="claims-table">
      {% for key, value in claims.items() %}
      <tr>
        <td>{{ key }}</td>
        <td>{{ value }}</td>
      </tr>
      {% endfor %}
    </table>

    <div class="actions">
      <a class="button primary" href="/profile">View profile</a>
      <a class="button" href="/">Start over</a>
      <a class="button" href="/logout">Sign out</a>
    </div>
  </div>
</body>
</html>
